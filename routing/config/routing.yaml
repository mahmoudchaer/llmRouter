version: routing_v2_3tier
tier_policy: "T1=old T1; T2=old T2+old T3; T3=old T4"
# Current testing model: Ox Alpha — free promotional pricing.
# TODO planned paid production fallback: qwen/qwen3-30b-a3b-instruct-2507
classifier_model: stealth/ox-alpha
runtime:
  active_mode: llm_only
  dedicated_tier_router_enabled: false
  preserved_optional_mode: hybrid
domain_classifier:
  implementation: transformers_qwen
  model_id: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  device: auto
  dtype: float16
  max_new_tokens: 20
  chunk_size_tokens: 24576
  chunk_overlap_tokens: 256
  do_sample: false
llm_tier_classifier:
  implementation: transformers_qwen
  model_id: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  device: auto
  dtype: float16
  max_new_tokens: 20
  chunk_size_tokens: 24576
  chunk_overlap_tokens: 256
  do_sample: false
local_runtime:
  share_model_instance: true
  note: separate prompts and calls share weights on Mac to reduce memory; distinct backends remain supported
mvp_classifier:
  implementation: openrouter
  endpoint: https://openrouter.ai/api/v1/chat/completions
  api_key_env: OPENROUTER_API_KEY
  timeout_seconds: 120
  max_output_tokens: 40
tier_router:
  checkpoint: null
  calibration_artifact: null
decision_policy:
  high_confidence: 0.85
  low_confidence: 0.60
  large_disagreement_tiers: 2
  allow_high_confidence_downward_disagreement: false
  thresholds_are_provisional_until_calibrated: true
  calibration_safety_target:
    max_under_routing: 0.10
    max_severe_under_routing: 0.02
    min_examples: 50
selection:
  no_suitable_model_behavior: error
  capability_shortfall_behavior: strongest_eligible_within_hard_ceiling
